name: Terraform (ecs-deployment)

on:
    pull_request:
      branches: [ main ]
      paths:
        - 'infra-ecs/*.tf'
        - 'infra-ecs/modules/**/*.tf'
        - 'infra-ecs/json/*.json'
    push:
      branches: [ main ]
      paths:
        - 'infra-ecs/*.tf'
        - 'infra-ecs/modules/**/*.tf'
        - 'infra-ecs/json/*.json'
  

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ap-northeast-1
  TF_DIR: ./infra-ecs
  STATE_SUFFIX: infra-ecs
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency: terraform-ecs-${{ github.head_ref || github.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.x

      - name: Compute state key
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
          echo "TF_STATE_KEY=${GITHUB_REPOSITORY#*/}/${STATE_SUFFIX}/terraform.tfstate" >> $GITHUB_ENV

      - name: Cache .terraform
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_DIR }}/.terraform
          key: ${{ runner.os }}-tf-ecs-${{ hashFiles(format('{0}/**.tf', env.TF_DIR)) }}

      - name: Terraform Init (S3 backend)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=nel-terraform" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Format (non-blocking)
        working-directory: ${{ env.TF_DIR }}
        continue-on-error: true
        run: |
          set +e
              if ! terraform fmt -check -recursive -diff > fmt.diff; then
                echo "::warning title=terraform fmt::Formatting issues detected. The workflow will continue."
                {
                  echo "### Terraform fmt (non-blocking)"
                  echo ""
                  echo "未整形ファイルがあります。整形してコミットしてください。"
                  echo ""
                  echo "<details><summary>fmt diff</summary>"
                  echo ""
                  echo '```diff'
                  cat fmt.diff
                  echo '```'
                  echo "</details>"
                } >> "$GITHUB_STEP_SUMMARY"
              else
                echo "### Terraform fmt (non-blocking): no issues 👍" >> "$GITHUB_STEP_SUMMARY"
              fi

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan (log only)
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -no-color

      - name: Comment Plan Summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Read terraform plan output (if saved to file)
            // For now, just create a summary comment
            const summary = `## 🏗️ ECS Infrastructure Plan Summary
            
            Terraform plan has been executed for ECS infrastructure changes.
            
            ### 📋 Changed Resources
            - ECS Services and Task Definitions
            - Application Load Balancer configuration  
            - CodeDeploy Blue/Green deployment setup
            - Security Groups and VPC resources
            - ECR repositories and CodePipeline
            
            ### ⚠️ Important Notes
            - This will affect the ECS Blue/Green deployment environment
            - Changes to ALB listener rules may impact traffic routing
            - CodeDeploy configuration changes require careful review
            
            Please review the plan output above before merging.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: terraform-ecs-apply
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.x

      - name: Compute state key
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
          echo "TF_STATE_KEY=${GITHUB_REPOSITORY#*/}/${STATE_SUFFIX}/terraform.tfstate" >> $GITHUB_ENV

      - name: Cache .terraform
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_DIR }}/.terraform
          key: ${{ runner.os }}-tf-ecs-${{ hashFiles(format('{0}/**.tf', env.TF_DIR)) }}

      - name: Terraform Init (S3 backend)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=nel-terraform" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan -no-color -out=tfplan.bin
          terraform apply -no-color -auto-approve tfplan.bin

      - name: Get Infrastructure Outputs
        id: terraform-outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "alb_dns_name=$(terraform output -raw alb_dns_name 2>/dev/null || echo 'not-available')" >> $GITHUB_OUTPUT
          echo "ecr_repository_url=$(terraform output -raw ecr_repository_url 2>/dev/null || echo 'not-available')" >> $GITHUB_OUTPUT
          echo "codecommit_clone_url=$(terraform output -raw codecommit_repository_clone_url_http 2>/dev/null || echo 'not-available')" >> $GITHUB_OUTPUT
          echo "codepipeline_name=$(terraform output -raw codepipeline_name 2>/dev/null || echo 'not-available')" >> $GITHUB_OUTPUT

      - name: Deployment Summary
        run: |
          echo "## 🚀 ECS Infrastructure Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Infrastructure Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Blue/Green ECS Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Method**: CodeDeploy with CodePipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Application URLs" >> $GITHUB_STEP_SUMMARY
          echo "- **Production (Blue)**: http://${{ steps.terraform-outputs.outputs.alb_dns_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Test (Green)**: http://${{ steps.terraform-outputs.outputs.alb_dns_name }}:8080" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Container & CI/CD" >> $GITHUB_STEP_SUMMARY
          echo "- **ECR Repository**: ${{ steps.terraform-outputs.outputs.ecr_repository_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CodeCommit Repository**: ${{ steps.terraform-outputs.outputs.codecommit_clone_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CodePipeline**: ${{ steps.terraform-outputs.outputs.codepipeline_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔄 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Push application code to CodeCommit repository" >> $GITHUB_STEP_SUMMARY
          echo "2. Monitor CodePipeline for automatic deployment" >> $GITHUB_STEP_SUMMARY
          echo "3. Test Blue environment via production URL" >> $GITHUB_STEP_SUMMARY
          echo "4. Test Green environment via test URL (port 8080)" >> $GITHUB_STEP_SUMMARY
          echo "5. Use CodeDeploy for Blue/Green traffic switching" >> $GITHUB_STEP_SUMMARY

      - name: Post-deployment Validation
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "🔍 Running post-deployment validation..."
          
          # Check if critical resources exist
          ALB_DNS="${{ steps.terraform-outputs.outputs.alb_dns_name }}"
          if [ "$ALB_DNS" != "not-available" ]; then
            echo "✅ ALB DNS Name: $ALB_DNS"
          else
            echo "⚠️ ALB DNS name not available"
          fi
          
          ECR_URL="${{ steps.terraform-outputs.outputs.ecr_repository_url }}"
          if [ "$ECR_URL" != "not-available" ]; then
            echo "✅ ECR Repository: $ECR_URL"
          else
            echo "⚠️ ECR repository URL not available"
          fi
          
          # Verify AWS resources
          echo "🔍 Verifying ECS cluster..."
          if aws ecs describe-clusters --clusters bg-deploy-test-ecs-cluster --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            echo "✅ ECS cluster exists"
          else
            echo "❌ ECS cluster not found"
            exit 1
          fi
          
          echo "🔍 Verifying ALB..."
          if aws elbv2 describe-load-balancers --names bg-deploy-test-alb --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            echo "✅ ALB exists"
          else
            echo "❌ ALB not found"
            exit 1
          fi
          
          echo "✅ Post-deployment validation completed successfully"